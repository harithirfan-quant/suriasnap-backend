name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR parser tests
        run: python test_parsers.py

      - name: Run WhatsApp flow tests
        run: python test_whatsapp_flow.py

      - name: Check app imports cleanly
        run: python -c "import app.main"
